$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: ClickHouse credentials
additionalProperties: false
properties:
  password:
    type: string
    title: ClickHouse password
    description: Password for the selected ClickHouse user.
  env:
    type: object
    title: Advanced ClickHouse secret environment
    additionalProperties: false
    properties:
      CLICKHOUSE_PASSWORD:
        type: string
    description: Optional ClickHouse password environment override.
