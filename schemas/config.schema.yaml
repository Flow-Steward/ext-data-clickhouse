$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: ClickHouse connection settings
additionalProperties: false
required:
- prebuilt
- host
- port
- database
- user
properties:
  prebuilt:
    type: string
    enum:
    - clickhouse
    title: SQL interface
    default: clickhouse
    description: ClickHouse SQL interface; this extension cannot select another database.
    const: clickhouse
    readOnly: true
  host:
    type: string
    title: Host
    description: ClickHouse host.
  port:
    type: string
    title: Port
    description: ClickHouse port.
  database:
    type: string
    title: Database
    description: ClickHouse database.
  user:
    type: string
    title: User
    description: ClickHouse user.
  protocol:
    type: string
    title: HTTPS / HTTP protocol
    description: HTTPS is the pinned driver default. Native TCP protocol is not supported by this prebuilt.
    enum:
    - https
    - http
    default: https
  env:
    type: object
    title: Advanced ClickHouse environment
    additionalProperties: false
    properties:
      CLICKHOUSE_HOST:
        type: string
      CLICKHOUSE_PORT:
        type: string
      CLICKHOUSE_DATABASE:
        type: string
      CLICKHOUSE_USER:
        type: string
      CLICKHOUSE_PROTOCOL:
        type: string
    description: Optional ClickHouse source environment overrides only. Credentials belong in secrets.
